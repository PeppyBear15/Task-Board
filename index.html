<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Task Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&display=swap">
<style>
:root{--card:#f3eefb;--ink:#241437;--mute:#6c6279;--gold:#A28D5B;--goldt:#d3be86;--royal:#2f55d4;--colbg:rgba(10,0,30,.5);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#2b1f40;--ink:#f1ecfa;--mute:#b2a6c4}}
:root[data-theme="dark"]{--card:#2b1f40;--ink:#f1ecfa;--mute:#b2a6c4}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#f3eefb;font:14px/1.45 "Merriweather",Georgia,serif;background:radial-gradient(900px 520px at 88% -8%,rgba(150,70,255,.8),transparent 62%),linear-gradient(160deg,#05000d 0%,#1d0646 36%,#5b17b8 72%,#1a0540 100%) fixed}
header{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:22px 24px 8px}
.ttl{flex:1 1 280px;min-width:0;font:900 clamp(26px,4vw,40px) "Merriweather",Georgia,serif;color:var(--goldt);background:transparent;border:1px solid transparent;border-radius:8px;padding:4px 8px}
.ttl:hover{border-color:rgba(162,141,91,.5)}.ttl:focus{outline:none;border-color:var(--gold);background:rgba(0,0,0,.25)}
nav{display:flex;gap:6px}
button{font:inherit;cursor:pointer;color:inherit}
.tab{background:transparent;border:1px solid var(--gold);color:var(--goldt);border-radius:8px;padding:7px 16px;font-weight:700}
.tab.on{background:var(--gold);color:#1a0540}
.btn{background:var(--gold);color:#1a0540;border:0;border-radius:8px;padding:7px 14px;font-weight:700;font-size:13px}
.btn.alt{background:transparent;color:var(--goldt);border:1px solid var(--gold)}
button:focus-visible,input:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--goldt);outline-offset:1px}
main{padding:8px 24px 40px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 14px}
.board{display:grid;gap:18px;align-items:start;overflow-x:auto}
.col{background:var(--colbg);border:1px solid var(--gold);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:50vh}
.col.over{outline:2px dashed var(--goldt);outline-offset:-5px}
.ct{display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--gold);padding-bottom:6px}
.ctin{flex:1;min-width:0;font:900 clamp(17px,2vw,24px) "Merriweather",Georgia,serif;text-transform:uppercase;letter-spacing:.04em;color:var(--goldt);background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 6px}
.ctin:focus{outline:none;border-color:var(--gold);background:rgba(0,0,0,.3)}
.n{color:var(--goldt);font-size:12px}
.x{background:none;border:0;color:var(--mute);border-radius:5px;padding:1px 6px;line-height:1.2}
.x:hover{background:rgba(127,127,127,.2);color:var(--ink)}
.ct .x{color:var(--goldt)}.ct .x.arm{background:#d64545;color:#fff;font-size:11px}
.cards{display:flex;flex-direction:column;gap:10px;min-height:6px}
.card{background:var(--card);color:var(--ink);border-radius:10px;padding:11px 11px 12px;cursor:grab}
.tt{display:flex;align-items:flex-start;gap:2px}
.tx{flex:1;font-weight:900;font-size:14px;padding:2px 4px;border-radius:4px;outline:none;word-break:break-word}
.tx:focus,.sx:focus{box-shadow:0 0 0 2px var(--gold);cursor:text}
.card .tt .x{opacity:0}.card:hover .tt .x,.card:focus-within .tt .x{opacity:1}
@media (hover:none){.card .tt .x{opacity:1}}
.pb{display:flex;height:9px;border-radius:5px;overflow:hidden;margin:9px 0 6px;background:rgba(127,127,160,.3)}
.s0{background:#d64545}.s1{background:#e8b923}.s2{background:#2e9e5b}
.tog{background:none;border:0;color:var(--mute);font-size:11px;padding:0}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:7px 0;border-top:1px solid rgba(127,127,160,.3)}
.sx{flex:1 1 100%;font-size:12px;padding:1px 4px;border-radius:4px;outline:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;background:rgba(127,127,160,.16);border:0;border-radius:12px;padding:3px 9px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
input[type=date]{font:11px "Merriweather",Georgia,serif;color:var(--ink);background:transparent;border:1px solid rgba(127,127,160,.4);border-radius:6px;padding:2px 4px;margin-left:auto}
.addf{display:flex;gap:6px;margin-top:auto}
.addf input{flex:1;min-width:0;font:13px "Merriweather",Georgia,serif;color:inherit;background:rgba(255,255,255,.08);border:1px dashed var(--gold);border-radius:8px;padding:8px 10px}
.card .addf{margin-top:6px}.card .addf input{background:rgba(127,127,160,.12);color:var(--ink);font-size:12px;padding:5px 8px}
.card .addf .btn{padding:4px 10px}
.panel{background:var(--colbg);border:1px solid var(--gold);border-radius:12px;padding:16px;margin-bottom:16px}
.panel h2{margin:0 0 12px;font-size:16px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;color:var(--goldt)}
.sb{display:flex;height:16px;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.12);flex:1}
.row{display:flex;align-items:center;gap:12px;margin:8px 0;font-size:13px}.row b{flex:0 0 min(210px,34%);font-weight:700}.row em{font-style:normal;flex:0 0 44px;text-align:right;color:var(--goldt)}
.leg{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px;font-size:12px}.leg span{display:inline-flex;align-items:center;gap:6px}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;border-bottom:1px solid var(--gold)}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--goldt)}
.bars i{display:block;width:100%;background:var(--royal);border-radius:4px 4px 0 0;min-height:2px}
.lab{display:flex;gap:6px;font-size:10px;color:var(--goldt)}.lab span{flex:1;text-align:center}
.lg{display:inline-flex;align-items:center;gap:7px;background:rgba(0,0,0,.35);border:1px solid var(--gold);border-radius:14px;padding:3px 4px 3px 10px;font-size:12px}.lg i{width:11px;height:11px;border-radius:3px}.lg .x{color:var(--goldt)}
.wt{width:100%;table-layout:fixed;border-collapse:collapse;background:var(--colbg)}
.wt th,.wt td{border:1px solid var(--gold);padding:0;vertical-align:top;overflow:hidden;min-width:0}
.wt th{padding:6px;color:var(--goldt);font-weight:900;text-transform:uppercase;letter-spacing:.03em;font-size:clamp(11px,1.4vw,15px);text-align:left}
.wt th small{display:block;font-weight:400;text-transform:none;letter-spacing:0;color:#f3eefb;font-size:.8em}
.wt th.today{background:var(--gold);color:#1a0540}.wt th.today small{color:#1a0540}
.wt td.ai{padding:4px;overflow-wrap:anywhere}
.wt td.al{font-size:9px;color:var(--goldt);padding:4px 3px;text-align:right}
.g{position:relative;--hp:44px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hp) - 1px),rgba(162,141,91,.35) calc(var(--hp) - 1px),rgba(162,141,91,.35) var(--hp))}
.ax .g{background:none}.ax span{position:absolute;right:4px;top:2px;font-size:10px;color:var(--goldt)}
.ev{border-radius:5px;padding:2px 5px;font-size:10.5px;margin-bottom:3px;line-height:1.25;cursor:pointer;overflow:hidden;overflow-wrap:anywhere}.ev b{display:block;font-size:9px;font-weight:700;opacity:.9}
.g .ev{position:absolute;margin:0;border:1px solid rgba(0,0,0,.35)}
.dv{background:var(--card);color:var(--ink);border-radius:6px;padding:4px 6px;font-size:10.5px;font-weight:700;margin-bottom:4px;line-height:1.3;cursor:pointer}.dv small{display:block;font-weight:400;opacity:.75}
.sw{width:18px;height:18px;padding:0;border:0;background:none;cursor:pointer;border-radius:4px}
#pop,#bgp,#syn{position:fixed;z-index:50;background:#1d0646;color:#f3eefb;border:1px solid var(--gold);border-radius:10px;padding:10px;width:184px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#pop[hidden],#bgp[hidden],#syn[hidden],#modal[hidden]{display:none}
#syn{top:64px;right:16px;width:270px}#syn label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--goldt)}#syn input{font:12px "Merriweather",Georgia,serif;color:#f3eefb;background:rgba(255,255,255,.1);border:1px solid rgba(162,141,91,.7);border-radius:7px;padding:6px 8px}.sm{font-size:11px;color:var(--goldt);overflow-wrap:anywhere}
.pt{font-size:12px;font-weight:700;color:var(--goldt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ps{display:flex;flex-wrap:wrap;gap:6px}.ps button{width:24px;height:24px;border-radius:6px;border:1px solid rgba(255,255,255,.4);padding:0}.ps input{width:100%;height:28px;padding:0;border:0;background:none}
.hint{font-size:12px;color:var(--goldt);max-width:70ch}
.wt td.ai{height:36px}
.dv.od{background:#d64545;color:#fff}.odt{color:#ff9a9a;font-weight:700}.wt th.today .odt{color:#8a1010}
.lg .nm{outline:none;border-radius:4px;padding:0 2px}.lg .nm:focus{box-shadow:0 0 0 2px var(--gold)}
#bgp{top:64px;right:16px;width:224px}.bgr{display:flex;gap:10px}.bgr label{font-size:10px;display:flex;flex-direction:column;gap:3px;color:var(--goldt)}.bgr input{width:46px;height:28px;padding:0;border:0;background:none}
#modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:12px}
.mp{background:#1d0646;color:#f3eefb;border:1px solid var(--gold);border-radius:14px;padding:18px;width:min(460px,100%);max-height:94vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.mp h3{margin:0;font-size:17px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;color:var(--goldt)}
.mp label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--goldt)}
.mp input,.mp select{font:13px "Merriweather",Georgia,serif;color:#f3eefb;background:rgba(255,255,255,.1);border:1px solid rgba(162,141,91,.7);border-radius:7px;padding:6px 8px}
.mp select option{color:#1a0540}
.mp .r{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}.mp .r>span.r{align-items:center;gap:4px}
.mp input[type=checkbox]{width:auto}.mp .dy{flex-direction:row;align-items:center;gap:4px}
.sw8{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.sw8 button{width:26px;height:26px;border-radius:7px;border:2px solid transparent;padding:0}.sw8 button.on{border-color:#fff}
.mp input[type=color]{padding:0;width:34px;height:26px;border:0;background:none}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.mp .btn.del{background:#d64545;color:#fff;border:0}
.mp .note{font-size:11px;color:var(--goldt);margin:0}
@media (max-width:600px){main{padding:8px 4px}.wt th{padding:3px}.ev,.dv{font-size:9px}.ev{padding:1px 3px}}
</style>

<body>
<header id="head"></header>
<main id="root"></main>
<input type="file" id="icsf" accept=".ics,text/calendar" multiple hidden>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
const KEY="gilded-kanban-v1",EV="gilded-cal-v1",ST=["Not started","Working on it","Done"],DN="SU,MO,TU,WE,TH,FR,SA".split(",");
const uid=()=>Math.random().toString(36).slice(2,9);
const p2=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
const dayOf=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monOf=d=>addDays(dayOf(d),-((d.getDay()+6)%7));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let today=dayOf(new Date());const dd=n=>iso(addDays(today,n));
const sb=(text,st,due)=>({id:uid(),text,st,due});
let S,view="board",ws=monOf(today),armed=null,dragId=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S)S={title:"Task Board",cols:[
 {id:uid(),title:"To do",tasks:[
  {id:uid(),text:"Plan chapter meeting",open:1,subs:[sb("Book room",0,dd(2)),sb("Draft agenda",1,dd(4))]},
  {id:uid(),text:"Order parts",subs:[sb("Get quotes",0,dd(6))]}]},
 {id:uid(),title:"In progress",tasks:[
  {id:uid(),text:"Write lab report",open:1,subs:[sb("Collect data",2,dd(0)),sb("Plot results",1,dd(3)),sb("Write discussion",0,dd(5))]}]},
 {id:uid(),title:"Done",tasks:[
  {id:uid(),text:"Submit scholarship form",subs:[sb("Get recommendation",2,dd(-3)),sb("Upload transcript",2,dd(-2))]}]}]};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}mark()};

/* ---- ICS (calendar view only) ---- */
function pdt(v){const m=v.match(/^(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d)(\d\d)?(Z)?)?$/);if(!m)return null;
 return m[7]?new Date(Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0))):new Date(+m[1],m[2]-1,+m[3],+(m[4]||0),+(m[5]||0))}
function parseICS(txt){
 const out=[];let c=null;
 for(const ln of txt.replace(/\r?\n[ \t]/g,"").split(/\r?\n/)){
  if(ln==="BEGIN:VEVENT"){c={ex:[]};continue}
  if(ln==="END:VEVENT"){if(c&&c.s){if(!c.e)c.e=c.ad?addDays(c.s,1):c.s;out.push(c)}c=null;continue}
  if(!c)continue;const i=ln.indexOf(":");if(i<0)continue;
  const nm=ln.slice(0,i).split(";")[0],v=ln.slice(i+1);
  if(nm==="SUMMARY")c.t=v.replace(/\\(.)/g,(m,x)=>x==="n"?" ":x);
  else if(nm==="DTSTART"){c.s=pdt(v);c.ad=/^\d{8}$/.test(v)}
  else if(nm==="DTEND")c.e=pdt(v);
  else if(nm==="RRULE"){c.rr=Object.fromEntries(v.split(";").map(x=>x.split("=")));if(c.rr.UNTIL)c.rr.UNTIL=pdt(c.rr.UNTIL)}
  else if(nm==="EXDATE")v.split(",").forEach(x=>{const d=pdt(x);if(d)c.ex.push(iso(d))});
  else if(nm==="STATUS"&&v==="CANCELLED")c.x=1;
  else if(nm==="UID")c.u=v;
  else if(nm==="RECURRENCE-ID")c.rid=pdt(v);
 }
 const m={};out.forEach(e=>{if(!e.rid&&e.u)m[e.u]=e});out.forEach(e=>{if(e.rid&&m[e.u])m[e.u].ex.push(iso(e.rid))});
 return out.filter(e=>!e.x);
}
function occ(e,d0){
 const d1=addDays(d0,1);
 if(!e.rr)return e.s<d1&&e.e>d0?{s:e.s,e:e.e}:null;
 const r=e.rr,k=+(r.INTERVAL||1),s0=dayOf(e.s);
 if(d0<s0||(r.UNTIL&&d0>r.UNTIL)||e.ex.includes(iso(d0)))return null;
 let ok=false;
 if(r.FREQ==="DAILY")ok=Math.round((d0-s0)/864e5)%k===0;
 else if(r.FREQ==="WEEKLY"){const w=Math.round((monOf(d0)-monOf(s0))/6048e5),by=r.BYDAY?r.BYDAY.split(",").map(x=>DN.indexOf(x.slice(-2))):[e.s.getDay()];ok=w%k===0&&by.includes(d0.getDay())}
 else if(r.FREQ==="MONTHLY")ok=d0.getDate()===s0.getDate()&&((d0.getFullYear()-s0.getFullYear())*12+d0.getMonth()-s0.getMonth())%k===0;
 else if(r.FREQ==="YEARLY")ok=d0.getDate()===s0.getDate()&&d0.getMonth()===s0.getMonth();
 if(!ok)return null;
 const s=new Date(d0);s.setHours(e.s.getHours(),e.s.getMinutes());return{s,e:new Date(+s+(e.e-e.s))};
}
const CK="gilded-cals-v2",PAL=["#2f55d4","#1f8a5b","#c2410c","#0e8f9a","#b0356b"],SEED=[];
const CATH={id:"cath",name:"Roman Catholic holidays",color:"#A28D5B",ink:"#1a0540",builtin:1};
let cals=null;const parsed={},catCache={};
try{cals=JSON.parse(localStorage.getItem(CK))}catch(e){}
if(!cals)cals=[...SEED,CATH];
const saveCals=()=>{try{localStorage.setItem(CK,JSON.stringify(cals))}catch(e){}mark()};
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),t=h+l-7*m+114;return new Date(y,Math.floor(t/31)-1,t%31+1)}
function catEvents(y){
 const E=easter(y),mk=(s,t)=>({t,s,e:addDays(s,1),ad:1,ex:[]}),o=(n,t)=>mk(addDays(E,n),t),f=(m,d,t)=>mk(new Date(y,m-1,d),t);
 const xm=new Date(y,11,25),a4=addDays(xm,-(xm.getDay()||7)),a1=addDays(a4,-21);
 return [o(-46,"Ash Wednesday"),o(-7,"Palm Sunday"),o(-3,"Holy Thursday"),o(-2,"Good Friday"),o(-1,"Holy Saturday"),o(0,"Easter Sunday"),o(7,"Divine Mercy Sunday"),o(39,"Ascension"),o(49,"Pentecost"),o(56,"Trinity Sunday"),o(63,"Corpus Christi"),
  mk(addDays(a1,-7),"Christ the King"),mk(a1,"First Sunday of Advent"),mk(addDays(a1,14),"Gaudete Sunday"),
  f(1,1,"Mary, Mother of God"),f(1,6,"Epiphany"),f(2,2,"Presentation of the Lord"),f(3,19,"St. Joseph"),f(3,25,"Annunciation"),f(6,24,"Birth of St. John the Baptist"),f(6,29,"Sts. Peter and Paul"),f(8,6,"Transfiguration"),f(8,15,"Assumption of Mary"),f(9,8,"Nativity of Mary"),f(9,14,"Exaltation of the Holy Cross"),f(11,1,"All Saints"),f(11,2,"All Souls"),f(12,8,"Immaculate Conception"),f(12,12,"Our Lady of Guadalupe"),f(12,25,"Christmas")];
}
const calEvents=(c,ys)=>c.builtin?ys.flatMap(y=>catCache[y]||(catCache[y]=catEvents(y))):(parsed[c.id]||(parsed[c.id]=parseICS(c.ics)));


/* ---- helpers ---- */
const allSubs=()=>S.cols.flatMap(c=>c.tasks.flatMap(t=>t.subs.map(s=>({...s,task:t.text}))));
const cnt=a=>[0,1,2].map(i=>a.filter(s=>s.st===i).length);
const seg=c=>c.map((n,i)=>n?`<i class="s${i}" style="flex:${n}"></i>`:"").join("");
const findTask=id=>{for(const c of S.cols){const i=c.tasks.findIndex(t=>t.id===id);if(i>-1)return{c,i,t:c.tasks[i]}}};
function moveTask(id,toCol,before){
 const f=findTask(id);if(!f)return;const[t]=f.c.tasks.splice(f.i,1);
 const d=S.cols.find(c=>c.id===toCol),j=before?d.tasks.findIndex(x=>x.id===before):-1;
 j>-1?d.tasks.splice(j,0,t):d.tasks.push(t);save();render();
}

/* ---- views ---- */
const taskH=t=>{const c=cnt(t.subs),done=t.subs.length?Math.round(c[2]/t.subs.length*100):0;
 return `<div class="card" draggable="true" data-t="${t.id}"><div class="tt"><span class="tx" contenteditable="plaintext-only" spellcheck="false" data-a="ttext">${esc(t.text)}</span><button class="x" data-a="mvl" title="Move left" aria-label="Move left">‹</button><button class="x" data-a="mvr" title="Move right" aria-label="Move right">›</button><button class="x" data-a="deltask" title="Delete task" aria-label="Delete task">×</button></div>

const ctx=e=>({c:S.cols.find(x=>x.id===(e.target.closest("[data-c]")||{dataset:{}}).dataset.c),f:findTask((e.target.closest("[data-t]")||{dataset:{}}).dataset.t),sid:(e.target.closest("[data-s]")||{dataset:{}}).dataset.s});
document.addEventListener("click",e=>{
 const tg=e.target;if(tg.closest("#modal"))return;
 const ee=tg.closest("[data-ev]");if(ee){openEv(+ee.dataset.ev);return}
 const gd=tg.closest("[data-day]");if(gd&&tg===gd){newAt(gd,e);return}
 const ek=tg.closest("[data-k]");if(ek&&!tg.closest("#pop")){openPop(ek);return}
 if(!tg.closest("#pop"))pop.hidden=true;
 if(!tg.closest("#bgp")&&!tg.closest('[data-a="bg"]'))bgp.hidden=true;
 if(!tg.closest("#syn")&&!tg.closest('[data-a="sync"]'))syn.hidden=true;
 const el=tg.closest("[data-a]");if(!el)return;const a=el.dataset.a,{c,f,sid}=ctx(e);
 if(a!=="delcol"&&armed){armed=null;if(!["ctitle","title","due","ttext","stext"].includes(a))render()}
 if(a==="tab"){view=el.dataset.v;render()}
 else if(a==="addcol"){S.cols.push({id:uid(),title:"New column",tasks:[]});save();render()}
 else if(a==="delcol"){if(c.tasks.length&&armed!==c.id){armed=c.id;render();return}armed=null;S.cols=S.cols.filter(x=>x!==c);save();render()}
 else if(a==="deltask"){f.c.tasks.splice(f.i,1);save();render()}
 else if(a==="tog"){f.t.open=!f.t.open;save();render()}
 else if(a==="mvl"||a==="mvr"){const k=S.cols.indexOf(f.c)+(a==="mvl"?-1:1);if(S.cols[k])moveTask(f.t.id,S.cols[k].id)}
 else if(a==="cyc"){const s=f.t.subs.find(x=>x.id===sid);s.st=(s.st+1)%3;save();render()}
 else if(a==="delsub"){f.t.subs=f.t.subs.filter(x=>x.id!==sid);save();render()}
 else if(a==="wk"){ws=+el.dataset.n?addDays(ws,+el.dataset.n):monOf(today);render()}
 else if(a==="imp")document.getElementById("icsf").click();
 else if(a==="rmcal"){cals=cals.filter(x=>x.id!==el.dataset.id);delete parsed[el.dataset.id];saveCals();render()}
 else if(a==="newev")openNew();
 else if(a==="sync"){syn.hidden=!syn.hidden;if(!syn.hidden)drawSyn()}
 else if(a==="bg"){bgp.hidden=!bgp.hidden;if(!bgp.hidden)drawBg()}
 else if(a==="bgp"){bg=BGP[+el.dataset.i].slice(1);saveBg();applyBg();drawBg()}
 else if(a==="bgr"){bg=BGP[0].slice(1);saveBg();applyBg();drawBg()}
 else if(a==="pc"){colors[popKey]=el.dataset.col;saveColors();pop.hidden=true;render()}
 else if(a==="prs"){delete colors[popKey];saveColors();pop.hidden=true;render()}
 else if(a==="addcath"){cals.push(CATH);saveCals();render()}
});
document.addEventListener("change",e=>{
 const a=e.target.dataset.a,{c,f,sid}=ctx(e);
 if(a==="ctitle"){c.title=e.target.value.trim()||c.title;save();render()}
 else if(a==="title"){S.title=e.target.value.trim()||S.title;document.title=S.title;save()}
 else if(a==="due"){f.t.subs.find(x=>x.id===sid).due=e.target.value;save();render()}
 else if(a==="bgc")saveBg();
 else if(a==="calcol"){cals.find(x=>x.id===e.target.dataset.id).color=e.target.value;saveCals();render()}
 else if(a==="pcc"){colors[popKey]=e.target.value;saveColors();pop.hidden=true;render()}
});
document.addEventListener("focusout",e=>{
 const a=e.target.dataset&&e.target.dataset.a;if(a==="calname"){const c=cals.find(x=>x.id===e.target.dataset.id),v=e.target.textContent.trim();if(c&&v){c.name=v;saveCals()}return}
 if(a!=="ttext"&&a!=="stext")return;
 const v=e.target.textContent.trim(),{f,sid}=ctx(e);if(!f)return;const o=a==="ttext"?f.t:f.t.subs.find(x=>x.id===sid);
 if(v&&v!==o.text){o.text=v;save()}else if(!v)render();
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&["ttext","stext","ctitle","title","calname"].includes(e.target.dataset.a)){e.preventDefault();e.target.blur()}
 if(e.key==="Escape"){syn.hidden=true;modal.hidden=true;bgp.hidden=true;pop.hidden=true;ed=null}});
document.addEventListener("input",e=>{if(e.target.dataset.a==="bgc"){bg[+e.target.dataset.i]=e.target.value;applyBg()}});
document.addEventListener("submit",e=>{
 e.preventDefault();const f=e.target,a=f.dataset.a,inp=f.querySelector("input"),v=inp.value.trim(),{c,f:fo}=ctx(e);if(!v)return;
 let key;
 if(a==="addtask"){c.tasks.push({id:uid(),text:v,open:0,subs:[]});key=`[data-c="${c.id}"]>.addf input`}
 else{fo.t.subs.push(sb(v,0,""));fo.t.open=1;key=`[data-t="${fo.t.id}"] .addf input`}
 save();render();const n=root.querySelector(key);if(n)n.focus();
});
document.getElementById("icsf").addEventListener("change",e=>{
 [...e.target.files].forEach(file=>{const r=new FileReader();
  r.onload=()=>{const t=String(r.result),m=t.match(/X-WR-CALNAME:(.+)/),id=uid();
   cals.push({id,name:(m?m[1].trim():file.name.replace(/\.ics$/i,"")).slice(0,40),color:PAL[cals.length%PAL.length],ics:t});saveCals();view="cal";render()};r.readAsText(file)});
 e.target.value="";
});
document.addEventListener("dragstart",e=>{const c=e.target.closest&&e.target.closest(".card");if(c){dragId=c.dataset.t;e.dataTransfer.setData("text/plain",dragId);e.dataTransfer.effectAllowed="move"}});
document.addEventListener("dragover",e=>{const c=dragId&&e.target.closest(".col");if(c){e.preventDefault();c.classList.add("over")}});
document.addEventListener("dragleave",e=>{const c=e.target.closest&&e.target.closest(".col");if(c&&!c.contains(e.relatedTarget))c.classList.remove("over")});
document.addEventListener("drop",e=>{const col=e.target.closest(".col");if(!dragId||!col)return;e.preventDefault();const b=e.target.closest(".card");moveTask(dragId,col.dataset.c,b&&b.dataset.t!==dragId?b.dataset.t:null);dragId=null});
document.addEventListener("dragend",()=>{dragId=null;render()});

/* ---- sync (Supabase) ---- */
const SYNC={url:"",key:""},SK="gilded-sync-v1",LTS="gilded-ts-v1";
let cfg=LS(SK,null);if(!cfg||!cfg.url)cfg={url:SYNC.url,key:SYNC.key};
let sbc=null,user=null,dirty=false,applying=false,pushT=null,syncMsg="",pulling=false;
const syn=document.createElement("div");syn.id="syn";syn.hidden=true;document.body.appendChild(syn);
function setMsg(m){syncMsg=m;const el=document.getElementById("synmsg");if(el)el.textContent=m;const b=document.querySelector('[data-a="sync"]');if(b)b.textContent="Sync "+(user?"●":"○")}
function mark(){if(applying)return;SV(LTS,Date.now());dirty=true;clearTimeout(pushT);if(sbc&&user)pushT=setTimeout(push,1500)}
const snap=()=>({S,mine,hid,skips,colors,cals,bg});
const busy=()=>{const a=document.activeElement;return !modal.hidden||(a&&(a.isContentEditable||/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)))};
async function push(){if(!sbc||!user)return;const ts=LS(LTS,0)||Date.now();SV(LTS,ts);
 const {error}=await sbc.from("boards").upsert({user_id:user.id,data:{...snap(),ts},updated_at:new Date().toISOString()});
 if(error)setMsg("Sync error: "+error.message);else{dirty=false;setMsg("Synced "+new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}))}}
function applyRemote(b){applying=true;
 if(b.S)S=b.S;mine=b.mine||[];Object.keys(hid).forEach(k=>delete hid[k]);Object.assign(hid,b.hid||{});Object.keys(skips).forEach(k=>delete skips[k]);Object.assign(skips,b.skips||{});
 colors=b.colors||{};if(b.cals)cals=b.cals;Object.keys(parsed).forEach(k=>delete parsed[k]);if(b.bg)bg=b.bg;
 save();saveMine();saveHid();saveColors();saveCals();saveBg();SV(LTS,b.ts||Date.now());applying=false;dirty=false;
 applyBg();document.title=S.title;render()}
async function pull(){if(!sbc||!user||pulling)return;pulling=true;
 try{const {data,error}=await sbc.from("boards").select("data,updated_at").maybeSingle();
  if(error){setMsg("Sync error: "+error.message);return}
  const lt=LS(LTS,0);
  if(!data){if(lt>0)await push();else setMsg("Signed in. Nothing to sync yet.");return}
  const rt=(data.data&&data.data.ts)||0;
  if(rt>lt){if(busy()){setMsg("Update waiting…");return}applyRemote(data.data);setMsg("Synced "+new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}))}
  else if(lt>rt)await push();else setMsg("Up to date")}
 finally{pulling=false}}
function initSync(){sbc=null;user=null;
 if(!window.supabase||!cfg.url||!cfg.key){setMsg(window.supabase?"Not configured":"Sync library did not load");return}
 try{sbc=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true}})}catch(e){setMsg("Bad project URL or key");return}
 sbc.auth.getSession().then(({data})=>{user=data&&data.session?data.session.user:null;setMsg(user?"Signed in":"Signed out");if(user)pull()})}
function drawSyn(){
 const f=(k,l,t,v)=>`<label>${l}<input data-f="${k}" type="${t||"text"}" value="${esc(v||"")}" autocomplete="${k==="pw"?"current-password":k==="em"?"username":"off"}"></label>`;
 let b;
 if(!cfg.url||!cfg.key)b=f("url","Supabase project URL","url",cfg.url)+f("key","Anon / publishable key","text",cfg.key)+`<button class="btn" data-sy="cfg">Save</button>`;
 else if(!user)b=f("em","Email","email")+f("pw","Password","password")+`<button class="btn" data-sy="in">Sign in</button><button class="btn alt" data-sy="chg">Change project</button>`;
 else b=`<div class="sm">Signed in as ${esc(user.email||"")}</div><button class="btn" data-sy="now">Sync now</button><button class="btn alt" data-sy="out">Sign out</button>`;
 syn.innerHTML=`<div class="pt">Sync across devices</div>${b}<div class="sm" id="synmsg">${esc(syncMsg)}</div>`}
syn.addEventListener("click",async e=>{const b=e.target.closest("[data-sy]");if(!b)return;const k=b.dataset.sy,q=n=>(syn.querySelector(`[data-f="${n}"]`)||{value:""}).value;
 if(k==="cfg"){cfg={url:q("url").trim().replace(/\/+$/,""),key:q("key").trim()};SV(SK,cfg);initSync();drawSyn()}
 else if(k==="in"){if(!sbc)return;setMsg("Signing in…");const r=await sbc.auth.signInWithPassword({email:q("em").trim(),password:q("pw")});
  if(r.error)setMsg(r.error.message);else{user=r.data.user;setMsg("Signed in");await pull()}drawSyn()}
 else if(k==="now"){setMsg("Syncing…");await pull()}
 else if(k==="out"){await sbc.auth.signOut();user=null;setMsg("Signed out");drawSyn()}
 else if(k==="chg"){cfg={url:"",key:""};SV(SK,cfg);sbc=null;user=null;drawSyn()}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});
setInterval(()=>{if(!document.hidden&&!dirty)pull()},30000);
initSync();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});
document.title=S.title;applyBg();render();
</script>
</body>
</html>
